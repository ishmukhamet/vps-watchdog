host_id: "example-vps"

telegram:
  token_file: /etc/vps-watchdog/telegram.token
  chat_id_file: /etc/vps-watchdog/telegram.chat_id

login:
  enabled: true

sudo:
  enabled: true

load:
  enabled: true
  sample_interval_sec: 15
  cooldown_sec: 900

  cpu_busy_percent: 90
  cpu_duration_sec: 180

  mem_available_percent: 10
  mem_duration_sec: 180

  psi_io_some_avg60: 20
  io_duration_sec: 180

disk:
  enabled: true
  paths: "/"
  sample_interval_sec: 60
  cooldown_sec: 21600
  duration_sec: 300
  free_percent: 10
  inodes_free_percent: 10

reboot:
  enabled: true

liveness:
  enabled: false
  ping_url_file: /etc/vps-watchdog/liveness.url
  interval_sec: 60
